<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Virtual Glasses Try-On</title>
    <meta charset='utf-8' />
    <meta name="description" content="Try on optical glasses virtually in real-time">

    <!-- Forbid resize on pinch with IOS Safari: -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"/>
    
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Glasses VTO">
    
    <!-- INCLUDE MAIN SCRIPT: -->
    <script src='dist/JeelizVTOWidget.js'></script>
    
    <!-- main stylesheet: -->
    <link rel='stylesheet' href='css/JeelizVTOWidget.css' />

    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed'));
        });
      }

      function get_initialSKU(){
        // look if a SKU is provided as a URL parameters:
        const queryString = window.location.search;
        const URLParams = new URLSearchParams(queryString);
        const sku = URLParams.get('sku') || 'rayban_round_cuivre_pinkBrownDegrade';
        console.log('Initial SKU =', sku);
        return sku;
      }

      function get_isShadow(){
        const queryString = window.location.search;
        const URLParams = new URLSearchParams(queryString);
        return URLParams.get('isHideShadow') ? false : true;
      }

      function showInstructions() {
        const instructions = document.getElementById('instructions');
        instructions.style.display = 'flex';
        setTimeout(() => {
          instructions.style.display = 'none';
        }, 5000);
      }

      // entry point:
      function main() {
        showInstructions();
        
        JEELIZVTOWIDGET.start({
          isShadow: get_isShadow(),
          sku: get_initialSKU(),
          searchImageMask: 'https://appstatic.jeeliz.com/jeewidget/images/target512.jpg',
          searchImageColor: 0xeeeeee,
          callbackReady: function(){
            console.log('INFO: Widget is ready');
          },
          onError: function(errorLabel){
            alert('An error happened. Please check your camera permissions.')
            switch(errorLabel) {
              case 'WEBCAM_UNAVAILABLE':
                break;
              case 'INVALID_SKU':
                break;
              case 'PLACEHOLDER_NULL_WIDTH':
              case 'PLACEHOLDER_NULL_HEIGHT':
                break;
              case 'FATAL':
              default:
                break;
            }
          }
        })
      }

      window.addEventListener('load', main);
    </script>
  </head>

  <body>
    <div class='content'>

      <!-- Instructions overlay -->
      <div id='instructions'>
        <div class='instructions-content'>
          <h2>How to Get Ideal Results</h2>
          <ul>
            <li>Ensure good lighting in your environment</li>
            <li>Look directly at the camera</li>
            <li>Keep your face centered in the frame</li>
            <li>Remove any existing glasses</li>
            <li>Hold still for best results</li>
          </ul>
        </div>
      </div>

      <!-- Please keep the same element IDs so that JEELIZVTOWIDGET can extract them from the DOM -->

      <!-- BEGIN JEELIZVTOWIDGET -->
      <!-- 
        div with id='JeelizVTOWidget' is the placeholder
        you need to size and position it according to where the VTO widget should be
        if you resize it, the widget will be automatically resized
      -->
      <div id='JeelizVTOWidget'>
        <!-- MAIN CANVAS: -->
        <!-- 
         canvas with id='JeelizVTOWidgetCanvas' is the canvas where the VTO widget will be rendered
         it should have CSS attribute position: absolute so that it can be resized without
         changing the total size of the placeholder
        -->
        <canvas id='JeelizVTOWidgetCanvas'></canvas>

        <!-- CHANGE MODEL BUTTONS: -->
        <div class='JeelizVTOWidgetControls' id='JeelizVTOWidgetChangeModelContainer'>
          <button onclick="JEELIZVTOWIDGET.load('rayban_round_cuivre_pinkBrownDegrade')">Round</button>
          <button onclick="JEELIZVTOWIDGET.load('rayban_clubmaster_havane_vert')">Clubmaster</button>
          <button onclick="JEELIZVTOWIDGET.load('rayban_wayfarer_havane_marron')">Wayfarer</button>
          <button onclick="JEELIZVTOWIDGET.load('rayban_new_wayfarer_havane_marronClassique_g15')">Classic</button>
        </div>

        <!-- BEGIN LOADING WIDGET (not model) -->
        <div id='JeelizVTOWidgetLoading'>
           <div class='JeelizVTOWidgetLoadingText'>
              LOADING...
            </div>
        </div>
        <!-- END LOADING -->

      </div>
    </div>
  </body>
</html>
